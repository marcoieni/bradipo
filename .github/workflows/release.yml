name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    # See ci.yml for the runner and Xcode choice.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: ./scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - run: ./scripts/package-dmg.sh
      - run: ./scripts/package-tarball.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" ".build/bradipo-${GITHUB_REF_NAME#v}.dmg" .build/bradipo.tar.gz \
            --verify-tag \
            --generate-notes \
            --notes "Install or update bradipo with the Terminal command or Homebrew as described in [Install](https://github.com/$GH_REPO#install). Builds are not notarized, so if you use the disk image instead, see [Install from the disk image](https://github.com/$GH_REPO#install-from-the-disk-image) before the first launch."

  cask:
    name: Update the Homebrew cask
    # A separate job, because re-running the release job would fail on the
    # release that already exists.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marcoieni/homebrew-tap
          # github.token can't push to another repository.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true # for git push
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cask=Casks/bradipo.rb
          version=${GITHUB_REF_NAME#v}
          current=$(grep -Po '^  version "\K[^"]+' "$cask")
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "Not downgrading the cask from $current to $version"
            exit 0
          fi

          sha256=$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq ".assets[] | select(.name == \"bradipo-$version.dmg\") | .digest | ltrimstr(\"sha256:\")")
          sed -i -E "s/^  version .*/  version \"$version\"/; s/^  sha256 \"[0-9a-f]{64}\"\$/  sha256 \"$sha256\"/" "$cask"
          # An empty digest or a sed that matched nothing must not reach the tap.
          if ! grep -Eq '^  sha256 "[0-9a-f]{64}"$' "$cask"; then
            echo "::error::$cask doesn't hold the published checksum"
            exit 1
          fi
          # A re-run may find the cask already updated.
          if git diff --quiet "$cask"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bradipo $version" "$cask"
          git push
