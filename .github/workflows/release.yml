name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    # See ci.yml for the runner and Xcode choice.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: ./scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - run: ./scripts/package-dmg.sh
      - run: ./scripts/package-tarball.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" ".build/bradipo-${GITHUB_REF_NAME#v}.dmg" .build/bradipo.tar.gz \
            --verify-tag \
            --generate-notes \
            --notes "Install or update bradipo with the Terminal command in [Install](https://github.com/$GH_REPO#install). Builds are not notarized, so if you use the disk image instead, see [Install from the disk image](https://github.com/$GH_REPO#install-from-the-disk-image) before the first launch."
