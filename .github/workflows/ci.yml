name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Swift 6.4 ships only with Xcode 27, which GitHub hosts on the Apple
    # silicon xcode-27 image (a public preview, actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The image defaults to Xcode 27.1; 27.2 brings the macOS 27.2 SDK.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: ./scripts/build-app.sh
