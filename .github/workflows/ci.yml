name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests cancel their superseded runs; each push to main gets its own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Swift 6.4 ships only with Xcode 27, which GitHub hosts on the Apple
    # silicon xcode-27 image (a public preview, actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The image defaults to Xcode 27.1; 27.2 brings the macOS 27.2 SDK.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      # Stamp a version like release.yml does, so that path runs before a tag.
      - run: ./scripts/build-app.sh 0.0.0
      - run: ./scripts/package-dmg.sh
      - run: ./scripts/package-tarball.sh
      # Install the archive like the README's Terminal command, which only avoids
      # the Gatekeeper block if curl's downloads aren't quarantined.
      - name: Install from the archive
        run: |
          curl -f "file://$PWD/.build/bradipo.tar.gz" -o "$TMPDIR/bradipo.tar.gz"
          tar -xzf "$TMPDIR/bradipo.tar.gz" -C /Applications
          codesign --verify --strict /Applications/bradipo.app
          if xattr -p com.apple.quarantine /Applications/bradipo.app; then
            echo "::error::The installed app is quarantined"
            exit 1
          fi

  cask:
    name: Homebrew cask
    # Like the app, the cask requires macOS 27. See build for the runner choice.
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      # Use the image's Homebrew as it is, because updating it is slow.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew style Casks/bradipo.rb
      # Install like the README does, but with this checkout as the tap. The cask
      # points to a published release, so this doesn't install the app built above.
      - run: brew tap marcoieni/bradipo "$PWD"
      - run: brew install --cask marcoieni/bradipo/bradipo
      - run: brew uninstall --cask --zap bradipo
